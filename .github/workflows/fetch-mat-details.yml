name: Fetch mat-details snapshot

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch mat-details
        env:
          GALACTIC_TYCOONS_API_KEY: ${{ secrets.GALACTIC_TYCOONS_API_KEY }}
        run: python scripts/fetch_mat_details.py

      - name: Commit and push snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mat-details/
          if git diff --cached --quiet; then
            echo "No new snapshot to commit"
          else
            git commit -m "Add mat-details snapshot $(date -u +%Y-%m-%dT%H-%M-%SZ)"
            git push
          fi
